# deCONZ (Phoscon) - the ConBee/RaspBee gateway software Athena's own deCONZ integration connects
# to over REST + WebSocket. Not part of the athena stack itself, run this on whichever machine the
# ConBee/RaspBee stick is physically plugged into. Independent of docker-compose-athena.yml - can
# live in this same folder, or its own, on a different host entirely.
#
# Put this file and .env (copied from .env.example) in the same folder, then:
#   docker compose -f docker-compose-deconz.yml up -d
# Then open http://<this-host>:8080 once to run Phoscon's own setup wizard and generate an API key
# (Settings > Gateway > Advanced > Authenticate app, or the "unlock gateway" step in the deCONZ
# desktop app) - Athena's own "Add gateway" form needs that key, plus this host's address and the
# web port below.

services:
  deconz:
    container_name: deconz
    image: deconzcommunity/deconz:latest
    restart: unless-stopped
    # Option A - pin one specific stick (simplest, matches most single-stick setups). Docker
    # resolves this to one fixed device node at container start, so unplugging the stick (or
    # swapping it for a different one) isn't guaranteed to keep working without running
    # `docker compose up -d` again.
    devices:
      - ${DECONZ_STICK_DEVICE:?set DECONZ_STICK_DEVICE in .env}:/dev/ttyACM0
    #
    # Option B - real hot-plug support instead (unplug/replug, or swap to a different stick, with
    # no container restart): comment out the devices: block above and use this instead, plus point
    # DECONZ_DEVICE below at the stable by-id path directly (not /dev/ttyACM0) - with the whole
    # host /dev visible, that symlink (and whatever real device it points at after a replug) is
    # visible inside the container too.
    # devices:
    #   - /dev:/dev
    # device_cgroup_rules:
    #   - 'c 166:* rmw'  # ttyACM* - USB CDC-ACM, e.g. ConBee II/III
    volumes:
      # Bind-mounted (not a named volume) so the gateway's own config/network data sits right
      # next to this compose file on real disk.
      - ./deconz-data:/opt/deCONZ
    ports:
      - '${DECONZ_WEB_PORT:-8080}:8080'  # deCONZ's own web UI (Phoscon) + REST API
      - '${DECONZ_WS_PORT:-8443}:8443'   # the WebSocket API Athena's own live-update connection uses
    environment:
      # Must match whatever device path the active devices: mapping above targets - /dev/ttyACM0
      # for Option A (the default here); switch this to the stable by-id path itself (not
      # /dev/ttyACM0) if you switch to Option B, since deCONZ otherwise has no way to find the
      # stick again after it re-enumerates under a different name.
      - DECONZ_DEVICE=${DECONZ_DEVICE:-/dev/ttyACM0}
      - DECONZ_WEB_PORT=${DECONZ_WEB_PORT:-8080}
      - DECONZ_WS_PORT=${DECONZ_WS_PORT:-8443}
      # - DECONZ_BAUDRATE=115200 # ConBee III; use 38400 for RaspBee II instead
